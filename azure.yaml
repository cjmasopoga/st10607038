name: agristream-iot
metadata:
  template: azd-init

services:
  web:
    project: .
    language: dotnet
    host: appservice
  api:
    project: ./SmartMonitoringSolutions.Functions
    language: dotnet
    host: function

hooks:
  postprovision:
    posix:
      shell: sh
      run: ./scripts/grant-sql-access.sh
    windows:
      shell: pwsh
      run: ./scripts/grant-sql-access.ps1
